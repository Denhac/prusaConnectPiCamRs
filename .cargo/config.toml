# Cross-compiling a static binary for 64-bit Raspberry Pi OS:
#   rustup target add aarch64-unknown-linux-musl
#   cargo build --release --target aarch64-unknown-linux-musl
# Needs clang, for the C code in ring (TLS). The linker ships with Rust.

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

# 32-bit Raspberry Pi OS (including Raspberry Pi 2):
#   sudo apt install gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
#   rustup target add armv7-unknown-linux-gnueabihf
#   cargo build --release --target armv7-unknown-linux-gnueabihf
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[env]
CC_aarch64_unknown_linux_musl = "clang"
CFLAGS_aarch64_unknown_linux_musl = "--target=aarch64-unknown-linux-musl"
