[package]
name = "prusa-connect-camera"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Uploads Raspberry Pi camera snapshots to Prusa Connect"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = { version = "0.11.11", default-features = false }
futures-util = "0.3.34"
libc = "0.2.191"
log = "0.4.34"
prost = "0.14.4"
rtc = "0.21.1"
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
ureq = "3.5.0"
uuid = { version = "1.26.1", features = ["v4"] }
webrtc = "0.21"
