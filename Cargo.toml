[package]
name = "prusa-connect-camera"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Uploads Raspberry Pi camera snapshots to Prusa Connect"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = { version = "0.11.11", default-features = false }
libc = "0.2.191"
log = "0.4.34"
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "3.5.0"
uuid = { version = "1.26.1", features = ["v4"] }
